<body>
<div class="app-shell">
<header class="topbar">
  <div class="brand"><div class="brand-mark">PWS</div><div class="brand-copy"><h1><span>照片墙工作室</span></h1></div></div>
  <div class="top-actions">
    <div class="trust"><i></i><span>照片仅在本机处理</span></div>
    <div class="btns">
      <button class="main" id="bPlay" disabled>▶ 预览效果</button>
      <button id="bExport" disabled>保存视频</button>
      <button id="bKf" disabled>导出关键帧</button>
    </div>
  </div>
</header>
<div class="wrap">
  <div class="side">
    <div class="card template-card"><div class="template-title-row"><h3><em>02</em>选择模板</h3></div><div class="tpls" id="tpls"></div></div>
    <div class="card import-card">
      <h3><em>01</em>导入素材</h3>
      <div class="drop" id="drop" role="button" tabindex="0"><b>选择照片</b><small>点击或拖入 JPG、PNG、WebP · 最多 200 张</small></div>
      <input type="file" id="fImg" accept="image/*" multiple hidden>
      <input type="file" id="fAud" accept="audio/*" hidden>
      <div class="row" style="margin-top:10px"><button class="sm" id="bAud">＋ 添加音乐（可选）</button><span class="status" id="audName">未添加音乐：按固定节奏</span></div>
      <div class="thumbs" id="thumbs" role="listbox" aria-label="已导入照片" aria-multiselectable="true"></div>
      <div class="thumb-trash" id="thumbTrash" aria-hidden="true"><span>拖到这里删除</span><b id="thumbSelN"></b></div>
      <div class="bar"><i id="prog"></i></div>
      <div class="status" id="imgStat">还没有照片</div>
    </div>
    <div class="card adjust-card">
      <h3><em>03</em>调整效果</h3>
      <div class="row ratio-row"><label for="ratios">画面比例</label><select id="ratios"><option value="9:16">9:16</option><option value="16:9">16:9</option><option value="3:4">3:4</option><option value="4:3">4:3</option></select><span class="status" id="ratioNote" hidden></span></div>
      <div class="row"><label>标题文案</label><input type="text" id="title" value="2026 · 我的旅行" maxlength="24"></div>
      <div id="notices"></div>
      <div id="tplSettings"></div>
      <div class="row"><label>通用</label><span class="chk"><input type="checkbox" id="shuf">随机打乱顺序（不勾选＝按选择顺序）</span></div>
      <div class="row"><label>导出格式</label><select id="fmt"><option value="auto" selected>自动（优先 MP4）</option><option value="webm">WebM</option></select><span class="status" id="fmtNote"></span></div>
    </div>
    <div class="status" id="stat"></div>
  </div>
  <div class="stage">
    <div class="stage-head"><strong>成片预览</strong><span class="stage-mode"><i></i>LIVE CANVAS</span></div>
    <div class="screen"><canvas id="cv" width="1080" height="1920"></canvas></div>
    <div class="stage-foot"><span>实时渲染</span><span>浏览器本地生成</span></div>
  </div>
</div>
</div>
<div id="kf"><div class="kbox">
  <div class="khead"><b>🖼 导出关键帧</b><span id="kfTpl" class="tip"></span><button class="sm" id="kfClose">✕ 关闭</button></div>
  <div class="row"><label>方式</label><select id="kfMode"><option value="auto">自动挑关键帧（卡点 / 每张照片定格的瞬间）</option><option value="cur">当前画面（可拖动选时间）</option></select></div>
  <div class="row" id="kfNRow"><label>张数</label><input type="range" id="kfN" min="1" max="24" step="1" value="9"><span class="val" id="kfNV">9 张</span></div>
  <div class="row" id="kfTRow" style="display:none"><label>画面时间</label><input type="range" id="kfT" min="0" max="10" step="0.01" value="0"><span class="val" id="kfTV">0:00.00</span></div>
  <div class="row"><label>格式</label><select id="kfFmt"><option value="png" selected>PNG（无损，文件较大）</option><option value="jpg">JPG（体积小）</option></select><span id="kfQW" class="chk" style="flex:1;display:none"><input type="range" id="kfQ" min="0.6" max="1" step="0.01" value="0.92"><span class="val" id="kfQV">92%</span></span></div>
  <div class="row"><label>拼图</label><span class="chk"><input type="checkbox" id="kfSheet" checked>同时生成一张拼图（所有选中的帧拼在一张图里，可当封面 / 预览）</span></div>
  <div class="btns"><button class="main" id="kfGo">生成关键帧</button></div>
  <div class="kstrip" id="kfStrip"></div>
  <div class="btns" id="kfDl" style="display:none"><button id="kfZip">⬇ 打包下载 ZIP</button><button id="kfEach">⬇ 逐张下载</button><button id="kfSheetBtn">⬇ 下载拼图</button><button id="kfShare" style="display:none">📤 分享 / 存到相册</button></div>
  <div class="status" id="kfStat">全部在本机生成：按当前画面比例的原尺寸，不是实时录制，几秒就好。</div>
</div></div>
<div id="ed"><div class="box">
  <div style="font-size:14px;font-weight:600">人物轮廓（用于「九宫格出框」）：默认自动抠图，可用笔刷补涂 / 擦除</div>
  <div id="edWrap"><canvas id="edImg"></canvas><canvas id="edMask"></canvas></div>
  <div class="row"><label style="min-width:auto">笔刷</label><input type="range" id="brush" min="8" max="120" value="40" style="max-width:160px">
    <span class="chk"><input type="radio" name="bm" id="bmPaint" checked>涂抹</span><span class="chk"><input type="radio" name="bm" id="bmErase">擦除</span></div>
  <div class="btns"><button class="sm" id="edHero">★ 设为主角</button><button class="sm" id="edAutoCut">🧠 自动抠人像</button><button class="sm" id="edClear">清除涂抹</button><button class="sm main" id="edDone">完成</button></div>

<script>
/* =====================================================================
   照片墙工作室 —— 架构说明
   S（共享核心）：照片导入/EXIF 日期/抠图元数据、节拍检测与循环、位图缓存、播放与导出。
   REG（模板注册表）：每个模板是一个对象
     { id, name, desc,
       settings:[{id,label,type:'range'|'select'|'check'|'text'|'lines',value,min,max,step,unit,options,rebuild}],
       init(S)        -> 根据当前照片/节拍/设置生成时间线（返回值存为模板内部状态）
       duration       -> 成片秒数（getter）
       need(t)        -> 时刻 t 要用到的照片下标数组（用于预取 / 释放内存）
       drawFrame(ctx,t)-> 在 1080x1920 画布上画第 t 秒
       idleT          -> 静态预览 / 模板缩略图用的时刻 }
   新模板只需 REG.push({...})，界面（模板卡片、设置面板）自动生成。
   ===================================================================== */
(()=>{
// 画面尺寸：随「画面比例」切换（短边固定 1080，长边按比例；都是偶数，H.264 友好）
const RATIOS={'9:16':[1080,1920],'16:9':[1920,1080],'3:4':[1080,1440],'4:3':[1440,1080]};
let RATIO='9:16',W=1080,H=1920;const FPS=30,MAXN=200,STORE=1440;
const LAND=()=>W>H,RTAG=()=>RATIO.replace(':','x');
// 3D 模板的取景缩放：以 9:16 为 1；3:4 与横屏按画面高度缩小，横屏左右会多看到一些内容
const vk=()=>W>H?Math.min(0.72,H/1500):Math.min(1,H/1920*1.12);
// 模糊背景用的小画布：比例跟着画面走
const AMBS=[];function ambC(w0){const c=document.createElement('canvas');c.dataset.w0=w0;AMBS.push(c);sizeAmb(c);return c;}
function sizeAmb(c){const k=+c.dataset.w0;if(W>=H){c.height=k;c.width=Math.round(k*W/H);}else{c.width=k;c.height=Math.round(k*H/W);}}
const FONT_T='"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC","SimSun",serif';
const FONT_S='-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif';
const FONT_M='"Courier New","DejaVu Sans Mono","Menlo","Consolas",monospace';
const $=id=>document.getElementById(id);
const cv=$('cv'),mainCtx=cv.getContext('2d');
const ease=x=>1-Math.pow(1-x,3),clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const backE=(c1)=>x=>{const c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2);};
function hashI(k){let x=(k+1)*2654435761>>>0;x^=x>>>13;x=Math.imul(x,1274126177)>>>0;return (x^(x>>>16))>>>0;}
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function cover(g,b,x,y,w,h){const s=Math.max(w/b.width,h/b.height),sw=w/s,sh=h/s;g.drawImage(b,(b.width-sw)/2,(b.height-sh)/2,sw,sh,x,y,w,h);}

/* ================= 共享核心 S ================= */
const S={W,H,items:[],nextId:1,seq:[],peaks:null,audioBuf:null,cache:new Map(),pending:new Map(),
  title:()=>$('title').value.trim(),
  // 位图缓存按照片的固定 id 存（照片可以拖动排序 / 删除，下标会变）
  get(idx){const it=S.items[idx];if(!it)return null;const id=it.id;if(S.cache.has(id))return S.cache.get(id);
    if(!S.pending.has(id))S.pending.set(id,createImageBitmap(it.blob).then(b=>{S.pending.delete(id);if(S.items.includes(it))S.cache.set(id,b);else b.close&&b.close();return b;}));return null;},
  async ensure(list){for(const i of list)if(i!=null&&S.items[i]){const id=S.items[i].id;S.get(i);if(!S.cache.has(id)&&S.pending.has(id))await S.pending.get(id);}},
  pin:new Set(),
  keep(set){const ids=new Set([...set].map(i=>S.items[i]&&S.items[i].id));for(const [id,b] of S.cache)if(!ids.has(id)&&!S.pin.has(id)){b.close&&b.close();S.cache.delete(id);onEvict(id);}},
  drop(id){const b=S.cache.get(id);if(b){b.close&&b.close();S.cache.delete(id);}onEvict(id);},
  // 卡点：从 start 开始切 count 段，每段约 dur 秒，吸附到 [0.6,1.4]×dur 窗口内最近的鼓点
  cuts(start,count,dur){const times=[start],strong=[];let t=start;const P=S.peaks;
    for(let k=0;k<count;k++){let next=t+dur,st=false;
      if(P){let best=null;for(const p of P){if(p.t>t+dur*0.6&&p.t<=t+dur*1.4){if(!best||Math.abs(p.t-next)<Math.abs(best.t-next)||(p.strong&&!best.strong))best=p;}if(p.t>t+dur*1.4)break;}if(best){next=best.t;st=best.strong;}}
      else st=(k%4===3);
      times.push(next);strong.push(st);t=next;}
    return{times,strong};},
  nextStrong(t,maxWait){if(!S.peaks)return null;for(const p of S.peaks){if(p.t>t&&p.t<=t+maxWait&&p.strong)return p.t;if(p.t>t+maxWait)break;}return null;},
};
const DEMO_URLS=[...Array(12)].map((_,i)=>`assets/demo/handdraw-${String(i+1).padStart(2,'0')}.webp`);
let demoMode=false,demoLoading=null;
function clearDemoAssets(){if(!demoMode)return;demoMode=false;for(const it of S.items)S.drop(it.id);S.items=[];S.seq=[];S.peaks=null;selectedIds&&selectedIds.clear&&selectedIds.clear();}

function exifDate(buf){
  try{const v=new DataView(buf);if(v.getUint16(0)!==0xFFD8)return null;let o=2;
    while(o<v.byteLength-10){const m=v.getUint16(o);

        const find=(ifd,tag)=>{const n=g16(ifd);for(let i=0;i<n;i++){const e=ifd+2+i*12;if(g16(e)===tag)return e;}return -1;};
        const str=e=>String.fromCharCode(...new Uint8Array(buf,t+g32(e+8),19));

        e=find(ifd0,0x0132);if(e>0)return str(e);return null;}
      if((m&0xFF00)!==0xFF00)break;o+=2+v.getUint16(o+2);}
  }catch(e){}return null;}

    if(r>95&&g>40&&b>20&&r>g&&r>b&&r-g>15&&mx-mn>15&&cb>=77&&cb<=127&&cr>=133&&cr<=173)m[k]=1;}

    while(st.length){const k=st.pop(),x=k%w,y=(k-x)/w;n++;cx+=x;cy+=y;if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;
      for(const q of [k-1,k+1,k-w,k+w]){if(q<0||q>=w*h||seen[q]||!m[q])continue;if((q===k-1&&x===0)||(q===k+1&&x===w-1))continue;seen[q]=1;st.push(q);}}

    if(n<6||bw>0.8||(x0===0&&x1===w-1))continue;            // 横贯全图：天空/沙滩/墙
    const fill=n/((x1-x0+1)*(y1-y0+1));if(fill>0.85&&bw>0.5)continue; // 大块均匀色块

  async function mk(it){const s=Math.min(1,maxSide/Math.max(it.w,it.h)),w=Math.max(1,Math.round(it.w*s)),h=Math.max(1,Math.round(it.h*s));
    try{return await createImageBitmap(it.blob,{resizeWidth:w,resizeHeight:h,resizeQuality:'high'});}
    catch(e){const b=await createImageBitmap(it.blob),c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(b,0,0,w,h);b.close&&b.close();return c;}}
  function pump(){while(run<3&&q.length){const it=q.shift();run++;mk(it).then(b=>m.set(it.id,b)).catch(()=>m.delete(it.id)).finally(()=>{run--;dirty=true;if(!q.length&&!run&&dirty){dirty=false;onDone&&onDone();}else pump();});}}
  return{get(idx){const it=S.items[idx];if(!it)return null;const v=m.get(it.id);if(v&&v!=='p')return v;if(!v){m.set(it.id,'p');q.push(it);pump();}return null;},
    async prepare(progress){let n=0,k=0;for(const it of [...S.items]){k++;const v=m.get(it.id);if(v&&v!=='p')continue;if(v==='p'){await new Promise(r=>setTimeout(r,30));if(m.get(it.id)==='p')continue;}
        m.set(it.id,'p');try{m.set(it.id,await mk(it));n++;}catch(e){m.delete(it.id);}if(k%10===0)progress(k);}
      while(run||q.length)await new Promise(r=>setTimeout(r,50));return n;}};}

async function makeZip(files){const parts=[],cen=[],enc=new TextEncoder(),d=new Date();let off=0;
  const dt=((d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1))&0xFFFF,dd=(((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate())&0xFFFF;
  for(const f of files){const data=new Uint8Array(await f.blob.arrayBuffer()),nm=enc.encode(f.name),crc=crc32(data),h=new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(8,0,true);h.setUint16(10,dt,true);h.setUint16(12,dd,true);h.setUint32(14,crc,true);h.setUint32(18,data.length,true);h.setUint32(22,data.length,true);h.setUint16(26,nm.length,true);h.setUint16(28,0,true);
    parts.push(h.buffer,nm,data);const c=new DataView(new ArrayBuffer(46));c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(10,0,true);c.setUint16(12,dt,true);c.setUint16(14,dd,true);
    c.setUint32(16,crc,true);c.setUint32(20,data.length,true);c.setUint32(24,data.length,true);c.setUint16(28,nm.length,true);c.setUint32(42,off,true);cen.push(c.buffer,nm);off+=30+nm.length+data.length;}
  const cs=cen.reduce((a,b)=>a+b.byteLength,0),e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cs,true);e.setUint32(16,off,true);
  return new Blob([...parts,...cen,e.buffer],{type:'application/zip'});}
async function kfFiles(withSheet){const out=[];for(const f of kfFrames.filter(f=>f.on))out.push({name:kfName(f),blob:await kfGetBlob(f)});
  if(withSheet){const sb=await kfSheet();if(sb)out.push({name:`${kfT.id}_${kfFrames.tag}_contact_sheet.${kfFmt()==='png'?'png':'jpg'}`,blob:sb});}return out;}
async function kfDo(fn){if(kfBusy)return;kfBusy=true;try{await fn();}catch(e){console.error(e);$('kfStat').textContent='❌ '+(e.message||e);}kfBusy=false;}
$('bKf').onclick=()=>{if(!S.items.length||demoMode)return;if(rec){status('正在录制视频，录完再导出关键帧（避免影响录制）。');return;}
  $('kf').style.display='flex';$('kfTpl').textContent=`当前模板：${cur.name} · 成片 ${cur.duration.toFixed(1)} 秒`;$('kfT').max=Math.max(0.1,cur.duration-0.01).toFixed(2);$('kfT').value=Math.min(lastPT,cur.duration-0.01).toFixed(2);$('kfTV').textContent=kfTimeShow(+$('kfT').value);
  if(kfT!==cur||kfFrames.ratio!==RATIO){$('kfStrip').innerHTML='';$('kfDl').style.display='none';kfFrames=[];}};
$('kfClose').onclick=()=>{$('kf').style.display='none';};
$('kfMode').onchange=()=>{const c=$('kfMode').value==='cur';$('kfNRow').style.display=c?'none':'';$('kfTRow').style.display=c?'':'none';};
$('kfN').oninput=()=>$('kfNV').textContent=$('kfN').value+' 张';
let kfTq=false;$('kfT').oninput=()=>{const t=+$('kfT').value;$('kfTV').textContent=kfTimeShow(t);if(!playing&&!kfTq){kfTq=true;requestAnimationFrame(()=>{kfTq=false;lastPT=+$('kfT').value;frameAt(cur,lastPT);});}};
$('kfFmt').onchange=()=>{$('kfQW').style.display=kfFmt()==='jpg'?'flex':'none';kfSheetBlob=null;};$('kfQ').oninput=()=>{$('kfQV').textContent=Math.round(kfQ()*100)+'%';kfSheetBlob=null;};
$('kfGo').onclick=kfGenerate;
$('kfZip').onclick=()=>kfDo(async()=>{$('kfStat').textContent='正在打包 ZIP…';const fs=await kfFiles($('kfSheet').checked),z=await makeZip(fs);kfSave(z,`${S.title()||'照片墙'}_${kfT.name}_${RTAG()}_关键帧.zip`);$('kfStat').textContent=`✅ 已打包 ${fs.length} 个文件（${(z.size/1048576).toFixed(1)} MB）。`;});
$('kfEach').onclick=()=>kfDo(async()=>{const fs=await kfFiles($('kfSheet').checked);for(const f of fs){kfSave(f.blob,f.name);await new Promise(r=>setTimeout(r,350));}
  $('kfStat').textContent=`✅ 已逐张下载 ${fs.length} 个文件。浏览器若询问「允许下载多个文件」请点允许；手机上建议用 ZIP 或分享。`;});
$('kfSheetBtn').onclick=()=>kfDo(async()=>{const sb=await kfSheet();kfSave(sb,`${kfT.id}_${kfFrames.tag}_contact_sheet.${kfFmt()==='png'?'png':'jpg'}`);$('kfStat').textContent='✅ 已下载拼图。';});
$('kfShare').onclick=()=>kfDo(async()=>{const fs=await kfFiles($('kfSheet').checked),files=fs.map(f=>new File([f.blob],f.name,{type:f.blob.type}));
  try{await navigator.share({files,title:S.title()||'关键帧'});$('kfStat').textContent='✅ 已打开分享（iPhone 选「存储图像」即可存到相册）。';}catch(e){if(e.name!=='AbortError')throw e;}});

/* ================= 画面比例（9:16 / 3:4 / 4:3 / 16:9） ================= */
function setRatio(r,opt={}){if(!RATIOS[r])r='9:16';if(rec&&r!==RATIO){status('正在录制，录完再切换画面比例');syncRatioBtns();return false;}
  const was=playing&&!rec;if(was)stop();RATIO=r;[W,H]=RATIOS[r];S.W=W;S.H=H;cv.width=W;cv.height=H;cv.style.aspectRatio=W+'/'+H;
  if(kfCv.width!==W||kfCv.height!==H){kfCv.width=W;kfCv.height=H;}AMBS.forEach(sizeAmb);document.body.classList.toggle('land',W>H);
  try{localStorage.setItem('photoStudio.ratio',r);}catch(e){}syncRatioBtns();
  REG.forEach(T=>{if(T.card){T.card.width=W>=H?240:176;T.card.height=Math.round(T.card.width*H/W);T.card.style.height='';}T.resize&&T.resize();});
  $('ratioNote').textContent=`${W}×${H}`+(W>H?' · 横屏：横拍照片更占优势':'');
  if(S.items.length){rebuild();drawThumbs();refreshCards();}renderNotices();syncImportViewportLimit();if(was)play(false);else drawIdle();return true;}
function syncRatioBtns(){$('ratios').value=RATIO;}
$('ratios').onchange=e=>setRatio(e.target.value);

/* ================= 事件 ================= */
const drop=$('drop');drop.onclick=()=>$('fImg').click();drop.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();$('fImg').click();}};$('bAud').onclick=()=>$('fAud').click();
$('fImg').onchange=e=>{addImages(e.target.files);e.target.value='';};$('fAud').onchange=e=>{addAudio(e.target.files[0]);e.target.value='';};
['dragenter','dragover'].forEach(ev=>document.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('on');}));
['dragleave','drop'].forEach(ev=>document.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('on');}));
document.addEventListener('drop',e=>{if($('ed').style.display==='flex')return;const fs=[...e.dataTransfer.files];const au=fs.find(f=>f.type.startsWith('audio/')||/\.(mp3|m4a|wav|aac|ogg)$/i.test(f.name));if(au)addAudio(au);addImages(fs.filter(f=>f!==au));});
$('shuf').onchange=()=>{rebuild();if(!playing)drawIdle();refreshCards();};
let tTimer=0;$('title').addEventListener('input',()=>{if(!playing)drawIdle();clearTimeout(tTimer);tTimer=setTimeout(refreshCards,600);});
$('fmt').onchange=fmtNote;fmtNote();
$('bPlay').onclick=()=>{if(playing){stop();status('已停止');}else play(false);};$('bExport').onclick=()=>play(true);
buildCards();buildSettings();{let r0='9:16';try{r0=localStorage.getItem('photoStudio.ratio')||'9:16';}catch(e){}setRatio(r0);}drawIdle();loadDemoAssets();
addEventListener('resize',syncImportViewportLimit);if('ResizeObserver'in window){const importLayoutObserver=new ResizeObserver(syncImportViewportLimit);importLayoutObserver.observe(document.querySelector('.stage'));importLayoutObserver.observe(document.querySelector('.template-card'));}syncImportViewportLimit();
if(document.fonts)document.fonts.load("600 40px PSHand").then(()=>{if(S.items.length){if(!playing)drawIdle();refreshCards();}}).catch(()=>{});

/* ================= 自动化接口（与网页预览共用 drawFrame） ================= */
window.__studio={S,REG,SEG,get cur(){return cur.id},get ready(){return S.items.length},pickMime,select:selectTpl,refreshCards,
  set(id,v){if(id==='title'||id==='shuf'){const e=$(id);if(e.type==='checkbox')e.checked=v;else e.value=v;}else cur.values[id]=v;buildSettings();rebuild();if(!playing)drawIdle();},
  info(){return{id:cur.id,total:cur.duration,stat:$('stat').textContent};},
  paint(i,strokes,hero){const it=S.items[i];const m=document.createElement('canvas');m.width=it.w;m.height=it.h;const g=m.getContext('2d');g.fillStyle='#fff';
    for(const [x,y,r] of strokes){g.beginPath();g.arc(x*it.w,y*it.h,r*it.w,0,Math.PI*2);g.fill();}it.mask=m;if(hero)it.hero=true;REG.forEach(T=>T.invalidate&&T.invalidate(i));drawThumbs();rebuild();},
  hero(i,v=true){S.items[i].hero=v;drawThumbs();rebuild();},
  kfPick:(n)=>kfPick(cur,n),setRatio,get ratio(){return RATIO},makeZip,openEditor,gridPops(){const T=REG.find(x=>x.id==='grid');return T.pops();},
  async renderAt(t){if(cur.prepare)await prepareCur();const ks=needSet(cur,Math.min(t,cur.duration-0.001));await S.ensure([...ks]);S.keep(ks);await S.ensure([...ks]);cur.drawFrame(mainCtx,t);return cv.toDataURL('image/jpeg',0.9);}};
})();
